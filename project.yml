name: SemaforoArnedillo

options:
  bundleIdPrefix: __BUNDLE_PREFIX__
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: __APPLE_TEAM_ID__
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic

targets:
  SemaforoArnedillo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/App/Assets.xcassets
        buildPhase: resources
      - path: Resources/App/PrivacyInfo.xcprivacy
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __APP_BUNDLE_ID__
        PRODUCT_NAME: SemaforoArnedillo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Resources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: es

    dependencies:
      - target: SemaforoLiveActivity
        embed: true

    scheme:
      gatherCoverageData: false

  SemaforoLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources/LiveActivity
      - path: Sources/Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __APP_BUNDLE_ID__.LiveActivity
        PRODUCT_NAME: SemaforoLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: Resources/LiveActivity/Info.plist
        DEVELOPMENT_LANGUAGE: es
