workflows:

  # ---------------------------------------------------------------
  # iOS: genera el IPA y lo sube a App Store Connect / TestFlight.
  # Este workflow NO se ha modificado.
  # ---------------------------------------------------------------
  ios-testflight:
    name: Semáforo Arnedillo - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $APP_BUNDLE_ID
      vars:
        APP_BUNDLE_ID: "com.txismon.semaforoarnedillo"
        APPLE_TEAM_ID: "CRJ8N72W2J"

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Generar proyecto Xcode
        script: |
          chmod +x Scripts/configure_project.sh
          Scripts/configure_project.sh

      - name: Aplicar perfiles al proyecto
        script: |
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/SemaforoArnedillo.xcodeproj" \
            --scheme "SemaforoArnedillo"

      - name: Auditoría IPA
        script: |
          chmod +x Scripts/preflight_ipa.sh
          Scripts/preflight_ipa.sh

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ---------------------------------------------------------------
  # Android: genera el APK instalable. Compila la carpeta /android.
  # No toca nada del proyecto iOS.
  # ---------------------------------------------------------------
  android-apk:
    name: Semáforo Arnedillo - APK Android
    max_build_duration: 45
    # Se usa la instancia de macOS porque las de Linux requieren plan de
    # pago en Codemagic. Las imágenes de macOS traen el Android SDK y
    # Gradle preinstalados, así que el APK se compila igual.
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Comprobar herramientas
        script: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          gradle --version

      - name: Preparar Gradle wrapper
        script: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Compilar APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Localizar APK
        script: |
          find android/app/build/outputs -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/**/*.apk
