workflows:
  ios-testflight:
    name: Semáforo Arnedillo - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $APP_BUNDLE_ID
      vars:
        APP_BUNDLE_ID: "com.txismon.semaforoarnedillo"
        APPLE_TEAM_ID: "CRJ8N72W2J"

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Generar proyecto Xcode
        script: |
          chmod +x Scripts/configure_project.sh
          Scripts/configure_project.sh

      - name: Aplicar perfiles al proyecto
        script: |
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/SemaforoArnedillo.xcodeproj" \
            --scheme "SemaforoArnedillo"

      - name: Auditoría IPA
        script: |
          chmod +x Scripts/preflight_ipa.sh
          Scripts/preflight_ipa.sh

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
